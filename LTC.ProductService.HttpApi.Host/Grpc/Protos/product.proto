syntax = "proto3";

option csharp_namespace = "LTC.ProductService.Grpc";

package product;

service ProductGrpc {
  rpc GetProducts (Empty) returns (ProductsResponse);
}

message Empty {}

message ProductMessage {
  string id = 1;
  string name = 2;
  string description = 3;
  string imageUrl = 4;
  string productType = 5;
  string status = 6;
}

message ProductsResponse {
  repeated ProductMessage items = 1;
}